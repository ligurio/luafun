name: Setup EmmyLua tools on Linux
inputs:
  packages:
    description: Space-separated cargo packages to install
    required: false
    default: emmylua_check
runs:
  using: composite
  steps:
    - name: Setup Rust toolchain
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: stable

    - name: Cache Cargo dependencies
      uses: actions/cache@v6
      with:
        path: |
          $HOME/.cargo/registry
          $HOME/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-

    - name: Setup EmmyLua tools
      run: >
        cargo install --locked
        --git https://github.com/EmmyLuaLs/emmylua-analyzer-rust
        --rev 9ab790824ca8bd15c9f612016dee3de42f83b896
        ${{ inputs.packages }}
      shell: bash
